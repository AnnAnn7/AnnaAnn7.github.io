<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Книги</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .book h2 {
            font-size: 20px;
        }

        .author {
            color: #666;
        }

        .price {
            font-weight: bold;
            margin-top: 15px;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
        }
    </style>

<body>

    <h1>Книги</h1>

    <p>Добро пожаловать в наш каталог книг.</p>

    <div class="books">

        <div class="book">
            <h2>Мастер и Маргарита</h2>
            <p class="author">Михаил Булгаков</p>
            <p class="price">990 ₽</p>
        </div>

        <div class="book">
            <h2>1984</h2>
            <p class="author">Джордж Оруэлл</p>
            <p class="price">790 ₽</p>
        </div>

        <div class="book">
            <h2>Атлант расправил плечи</h2>
            <p class="author">Айн Рэнд</p>
            <p class="price">1 190 ₽</p>
        </div>

        <div class="book">
            <h2>Три товарища</h2>
            <p class="author">Эрих Мария Ремарк</p>
            <p class="price">850 ₽</p>
        </div>

        <div class="book">
            <h2>Маленький принц</h2>
            <p class="author">Антуан де Сент-Экзюпери</p>
            <p class="price">650 ₽</p>
        </div>

    </div>

    <a href="index.html">← Вернуться на главную</a>

</body>
</html>
